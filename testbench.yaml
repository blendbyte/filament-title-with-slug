laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\Filament\WorkbenchPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin/title-with-slug-playground'
  install: true
  health: false
  discovers:
    web: false
    api: false
    commands: true
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - filament-assets
    - workbench-filament-theme
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
